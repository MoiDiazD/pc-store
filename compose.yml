services:
  postgres:
    image: postgres:17
    container_name: pc-store-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pcstore
      POSTGRES_PASSWORD: pcstore_dev
      POSTGRES_DB: pcstore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: